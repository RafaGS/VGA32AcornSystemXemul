; Acorn System 3 / System 4 (6502) para TTGO VGA32 (ESP32 + FabGL).
; El modelo se elige con un #define de compilacion (src/emu/Model.h) mediante el entorno:
;   pio run -e system3 -t upload           (por defecto: una unidad de disquete)
;   pio run -e system4 -t upload           (dos unidades de disquete)
;   pio run -e system4_invaders -t upload  (System 4 + tarjetas del System 5: NO autentico; para el juego Space Invaders)
; ESTADO: una version anterior del System 3 compilo y funciono en la placa (confirmado por el usuario). Los cambios posteriores
; (mapa de memoria y 8271 alineados con el emulador de referencia, System 4) NO se han compilado ni probado en la placa;
; ver docs/SYSTEM3.md.
[platformio]
default_envs = system3

[env]
; FabGL 1.0.x necesita arduino-esp32 2.0.x (plataforma espressif32 6.x); no usar core 3.x.
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
lib_deps = fdivitto/FabGL@^1.0.9
build_flags =
    -O2
    -Isrc/emu
    ; Distribucion de teclado de FabGL (por defecto US), p. ej. espanol:
    ; -DS3_KBD_LAYOUT=SpanishLayout
    ; Altura de celda (18 por defecto; 19 es el maximo que cabe en 480 px) y desplazamiento vertical inicial:
    ; -DS3_CELL_H=19
    ; -DS3_Y_OFFSET=10

[env:system3]
build_flags =
    ${env.build_flags}
    -DS3_MODEL_SYSTEM3

[env:system4]
build_flags =
    ${env.build_flags}
    -DS3_MODEL_SYSTEM4
